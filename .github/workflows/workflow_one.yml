 name: workflow_one

on:
  push:

jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest

    steps:
      - name: Display message
        run: |
          echo "Hello from example_matrix job"
          echo "Hi this is my first GitHub Workflow"
          cat /etc/os-release

  job2:
    name: Job2
    runs-on: ubuntu-latest

    steps:
      - name: Checking the Hostname for runner
        run: hostname

      - name: Running multiple commands again
        run: echo "Current time is $(date)"

  job3:
    name: Job3
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Job with single dependency
        run: sleep 10

  job4:
    name: Job4
    needs: job2
    runs-on: ubuntu-latest

    steps:
      - name: Job with single dependency
        run: sleep 10
